name: Validar e publicar a abertura do site no Android
on:
  push:
    branches: [corrigir-abertura-android]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      APK_URL: https://github.com/Marcelo-Preigschadt/FaixaLab/releases/download/v0.10.1/FaixaLab_Audio_Android.apk
      SITE: https://marcelo-preigschadt.github.io/FaixaLab/
      COMPONENT: io.github.faixalab.importador/io.github.faixalab.android.ImportActivity
    steps:
      - name: Compilar APK e conferir a assinatura anterior
        run: |
          set -euo pipefail
          git init -q .
          git fetch --quiet --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 indisponível}"
          export PATH="$JAVA_HOME/bin:$PATH"
          cli=$(find "$ANDROID_HOME" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$cli"
          printf '%s\n' "$(dirname "$cli")" "$ANDROID_HOME/emulator" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdk_packages=()
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" ]]; then sdk_packages+=('platforms;android-35'); fi
          if [[ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then sdk_packages+=('build-tools;35.0.0'); fi
          if (( ${#sdk_packages[@]} )); then "$cli" --sdk_root="$ANDROID_HOME" "${sdk_packages[@]}"; fi
          gradle_url=https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip
          curl -fsSL --retry 2 --max-time 90 "$gradle_url" -o "$RUNNER_TEMP/gradle.zip"
          sum=$(curl -fsSL --retry 2 --max-time 30 "$gradle_url.sha256")
          printf '%s  %s\n' "$sum" "$RUNNER_TEMP/gradle.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" -p android :app:assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/FaixaLab_Audio_Android_1_2.apk"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 --max-time 60 "$APK_URL" -o previous.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          old_signer=$("$apksigner" verify --print-certs previous.apk | awk -F ': ' '/certificate SHA-256 digest/{print $2}')
          new_signer=$("$apksigner" verify --print-certs FaixaLab_Audio_Android_1_2.apk | awk -F ': ' '/certificate SHA-256 digest/{print $2}')
          test -n "$old_signer" && test -n "$new_signer"
          if [[ "$old_signer" == "$new_signer" ]]; then echo 'Assinatura compatível com o APK anterior.'; else echo 'O APK anterior usava outra assinatura de depuração. A instalação exige remover aquela versão uma vez.'; fi
          unzip -p FaixaLab_Audio_Android_1_2.apk res/raw/ytdlp | sha256sum | cut -d' ' -f1 | grep -Fx e51e69e89489f199530f13d32a4342da3ddb2cf34842f364603a066db05afbf3
      - name: Iniciar Android 14 com um navegador instalado
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 indisponível}"
          export PATH="$JAVA_HOME/bin:$PATH"
          image='system-images;android-34;google_apis;x86_64'
          sdkmanager --sdk_root="$ANDROID_HOME" emulator platform-tools "$image"
          unset ANDROID_SDK_HOME
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --name faixalab-test --package "$image" --path "$ANDROID_AVD_HOME/faixalab-test.avd" --force <<< no
          emulator -list-avds | grep -Fx faixalab-test
          emulator -avd faixalab-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          trap 'if [[ $? -ne 0 ]]; then tail -40 "$RUNNER_TEMP/emulator.log"; fi' EXIT
          adb start-server
          for i in {1..50}; do
            kill -0 "$pid"
            if [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
      - name: Tocar no botão, verificar o navegador e o retorno à mesma aba
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          browser=$(adb shell cmd package resolve-activity --brief -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$SITE" -p com.android.chrome | tr -d '\r' | tail -1)
          if [[ "$browser" != */* ]]; then
            browser=$(adb shell cmd package resolve-activity --brief -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$SITE" | tr -d '\r' | tail -1)
          fi
          test "$browser" != "${browser#*/}"
          package=${browser%%/*}
          echo "Navegador resolvido pelo Android $package"
          adb install FaixaLab_Audio_Android_1_2.apk
          adb forward tcp:39082 tcp:17863
          tap_button() {
            adb shell uiautomator dump /data/local/tmp/faixalab-ui.xml >/dev/null
            adb exec-out cat /data/local/tmp/faixalab-ui.xml > faixalab-ui.xml
            local coordinates
            coordinates=$(python3 - "$1" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          for node in ET.parse('faixalab-ui.xml').iter('node'):
              if node.get('text', '').lower() == sys.argv[1].lower():
                  x1, y1, x2, y2 = map(int, re.findall(r'\d+', node.attrib['bounds']))
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          else:
              sys.exit(f'Botão não encontrado: {sys.argv[1]}')
          PY
            )
            local tap_x tap_y
            read -r tap_x tap_y <<< "$coordinates"
            adb shell input tap "$tap_x" "$tap_y"
          }
          wait_for_browser() {
            for i in {1..25}; do
              if adb shell dumpsys activity activities | grep -E 'topResumedActivity|mResumedActivity' | grep -F "$package/"; then return; fi
              sleep 1
            done
            return 1
          }
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n "$COMPONENT"
          adb logcat -b system -c
          tap_button 'Abrir FaixaLab no navegador'
          wait_for_browser
          adb logcat -b system -d -s ActivityTaskManager:I '*:S' > browser.log
          grep -E 'START .*act=android.intent.action.VIEW.*dat=https://marcelo-preigschadt\.github\.io/' browser.log
          test "$(curl -fsS --max-time 5 -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:39082/import -H 'Host: 127.0.0.1:17863' -H 'Origin: https://marcelo-preigschadt.github.io')" = 204
          adb shell am start -W -a android.intent.action.VIEW -d faixalab-importador://abrir -n "$COMPONENT"
          adb logcat -b system -c
          tap_button 'Voltar ao navegador'
          wait_for_browser
          adb logcat -b system -d -s ActivityTaskManager:I '*:S' > return.log
          if grep -E 'START .*act=android.intent.action.VIEW.*dat=https://marcelo-preigschadt\.github\.io/' return.log; then exit 1; fi
          echo 'O botão abriu o site com o importador ativo. Ao voltar da ativação pelo site, a aba existente foi retomada.'
      - name: Publicar o APK validado no endereço de instalação do site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release="repos/$GITHUB_REPOSITORY/releases/tags/v0.10.1"
          assets="repos/$GITHUB_REPOSITORY/releases/assets"
          current=$(gh api "$release" --jq '.assets[] | select(.name == "FaixaLab_Audio_Android.apk") | .id')
          test "$current" = 749210250
          gh release upload v0.10.1 FaixaLab_Audio_Android_1_2.apk --repo "$GITHUB_REPOSITORY"
          candidate=$(gh api "$release" --jq '.assets[] | select(.name == "FaixaLab_Audio_Android_1_2.apk") | .id')
          test -n "$candidate"
          sum=$(sha256sum FaixaLab_Audio_Android_1_2.apk | cut -d' ' -f1)
          test "$(gh api "$assets/$candidate" --jq .digest)" = "sha256:$sum"
          gh api --method PATCH "$assets/$current" -f name=FaixaLab_Audio_Android_1_1.apk --jq .name
          if ! gh api --method PATCH "$assets/$candidate" -f name=FaixaLab_Audio_Android.apk --jq .name; then
            gh api --method PATCH "$assets/$current" -f name=FaixaLab_Audio_Android.apk --jq .name
            exit 1
          fi
          printf 'APK publicado id=%s sha256=%s\n' "$candidate" "$sum"
