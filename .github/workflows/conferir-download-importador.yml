name: Verificar botão do importador publicado
on:
  push:
    branches: [conferir-download-importador]
permissions:
  contents: read
  statuses: write
jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Conferir HTML e script publicados
        env:
          SITE: https://marcelo-preigschadt.github.io/FaixaLab
        run: |
          cd "$RUNNER_TEMP"
          for attempt in {1..8}; do
            if curl -fsS --max-time 5 "$SITE/?v=461223d492b2-$attempt" -o index.html &&
               grep -Fq 'id="install-faixalab-importer"' index.html &&
               grep -Fq 'src="./app.js?v=461223d492b2"' index.html &&
               curl -fsS --max-time 5 "$SITE/app.js?v=461223d492b2-$attempt" -o app.js &&
               [[ "$(git hash-object app.js)" == "461223d492b2c18c22365f99ff00f7eaed333d54" ]]; then
              exit 0
            fi
            sleep 6
          done
          exit 1
      - name: Registrar resultado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
        run: |
          resultado="$RESULTADO"
          if [[ "$resultado" != success ]]; then resultado=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --field "state=$resultado" --field 'context=faixalab/download-importador-publicado' \
            --field "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
