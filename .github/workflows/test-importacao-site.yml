name: Testar importação do site
on:
  push:
    branches: [faixalab-site-import, faixalab-import-retry, retomada-faixalab, corrigir-importacao-chromebook]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Obter a revisão
        run: |
          git init .
          git fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Build e teste no Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/faixalab-test"
          source "$RUNNER_TEMP/faixalab-test/bin/activate"
          pip install playwright==1.56.0
          python -m playwright install chromium
          node online/build-pages.mjs "$RUNNER_TEMP/site" expert-space-funicular-gjxr569wq4939wg9
          node online/build-pages.mjs "$RUNNER_TEMP/site-wake" expert-space-funicular-gjxr569wq4939wg9 https://faixalab-retomada.onrender.com
          python online/test_site_import.py "$RUNNER_TEMP/site" "$RUNNER_TEMP/site-wake"
      - name: Conferir o pacote oferecido ao Chromebook
        run: |
          curl -fsS --max-time 20 https://marcelo-preigschadt.github.io/FaixaLab/Instalar_FaixaLab_Linux.deb -o "$RUNNER_TEMP/faixalab.deb"
          test "$(dpkg-deb -f "$RUNNER_TEMP/faixalab.deb" Package)" = faixalab-importador
          dpkg-deb -x "$RUNNER_TEMP/faixalab.deb" "$RUNNER_TEMP/faixalab-installer"
          grep -Fx 'Name=Importador FaixaLab' "$RUNNER_TEMP/faixalab-installer/usr/share/applications/faixalab-importador.desktop"
