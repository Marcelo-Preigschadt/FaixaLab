name: Testar importação do site
on:
  push:
    branches: [faixalab-site-import, faixalab-import-retry, retomada-faixalab, instalar-app-web-chromebook, instalar-importador-grafico, captura-audio-chromebook, instalar-faixalab-online]
permissions:
  contents: read
  statuses: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Obter a revisão
        run: |
          git init .
          git fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Build e teste no Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/faixalab-test"
          source "$RUNNER_TEMP/faixalab-test/bin/activate"
          pip install playwright==1.56.0
          python -m playwright install chromium
          node online/build-pages.mjs "$RUNNER_TEMP/site" expert-space-funicular-gjxr569wq4939wg9
          node online/build-pages.mjs "$RUNNER_TEMP/site-wake" expert-space-funicular-gjxr569wq4939wg9 https://faixalab-retomada.onrender.com
          if [[ "$GITHUB_REF_NAME" == captura-audio-chromebook || "$GITHUB_REF_NAME" == instalar-faixalab-online ]]; then
            if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
              sudo apt-get -qq update
              sudo apt-get -qq install -y ffmpeg
            fi
            FAIXALAB_TEST_TAB_CAPTURE=1 xvfb-run -a python online/test_site_import.py "$RUNNER_TEMP/site" "$RUNNER_TEMP/site-wake"
          else
            python online/test_site_import.py "$RUNNER_TEMP/site" "$RUNNER_TEMP/site-wake"
          fi
      - name: Registrar resultado da captura
        if: always() && (github.ref_name == 'captura-audio-chromebook' || github.ref_name == 'instalar-faixalab-online')
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ job.status }}
        run: |
          resultado="$RESULTADO"
          if [[ "$resultado" != success ]]; then resultado=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --field "state=$resultado" --field 'context=faixalab/chromebook-audio' \
            --field "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
